name: Zahlen abholen

on:
  schedule:
    - cron: "17 4 * * *"   # täglich 04:17 UTC
  workflow_dispatch:        # von Hand: Actions → Zahlen abholen → Run workflow

permissions:
  contents: write

concurrency:
  group: zahlen-abholen
  cancel-in-progress: false

jobs:
  abholen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Zahlen von Google und Meta abholen
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GBP_KONTO: ${{ secrets.GBP_KONTO }}
          GBP_STANDORT: ${{ secrets.GBP_STANDORT }}
          META_TOKEN: ${{ secrets.META_TOKEN }}
          IG_KONTO: ${{ secrets.IG_KONTO }}
          FB_SEITE: ${{ secrets.FB_SEITE }}
        run: python3 abholen.py

      - name: Ergebnis speichern
        if: always()
        run: |
          git config user.name "zahlen-abholen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --cached --quiet; then
            echo "Keine Änderung."
          else
            git commit -m "Zahlen vom $(date -u +%F)"
            git push
          fi
